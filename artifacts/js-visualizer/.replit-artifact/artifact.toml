kind = "web"
previewPath = "/"
title = "JS Execution Visualizer"
version = "1.0.0"
id = "artifacts/js-visualizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.development]
run = "pnpm --filter @workspace/js-visualizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/js-visualizer", "run", "build" ]
publicDir = "artifacts/js-visualizer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5000"
BASE_PATH = "/"
